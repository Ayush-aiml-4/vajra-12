# VAJRA — Disposable Local PostgreSQL 15 Compose Definition
# Bound strictly to 127.0.0.1:5432 for local development and `npm run test:pg`.
# Never use default development credentials outside loopback test environments.

services:
  postgres-test:
    image: postgres:15-bookworm
    container_name: vajra-postgres-disposable
    restart: "no"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vajra_test}
      POSTGRES_USER: ${POSTGRES_USER:-vajra_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in shell before starting}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vajra_test} -d $${POSTGRES_DB:-vajra_test}"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
